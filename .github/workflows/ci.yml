name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test connection, shortcuts and geometry
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Check documentation links and version alignment
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1
      - name: Build production application
        shell: pwsh
        run: ./scripts/Build.ps1 -Production -Portable -Destination ./artifacts/production

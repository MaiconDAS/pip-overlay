name: Português — Relatar problema
description: Algo não funcionou como esperado.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Versão do aplicativo
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Windows, navegador, GPU, driver e modo de exibição do jogo. Não inclua dados pessoais.
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: API gráfica
      options:
        - Não sei
        - DirectX 9
        - DirectX 11
        - DirectX 12
        - OpenGL
        - Vulkan
  - type: input
    id: quality
    attributes:
      label: Resolução e FPS
  - type: textarea
    id: reproduce
    attributes:
      label: Reprodução e resultado esperado
      description: Informe os passos e o comportamento observado. Revise logs antes de compartilhar.
    validations:
      required: true
